services:
  # ──────────────────────────────────────────
  # Container 1: MySQL Database
  # ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: prodisync_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - prodisync_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ──────────────────────────────────────────
  # Container 2: Flask Application (Gunicorn)
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: prodisync_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ./storage:/app/storage
    networks:
      - prodisync_net
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "==> Menjalankan migrasi database (Flask-Migrate)..."
        flask db upgrade
        echo "==> Seed data pengguna & tahun ajaran..."
        flask seed-db || true
        echo "==> Seed katalog mata kuliah..."
        flask seed-matakuliah || true
        echo "==> Semua selesai. Menjalankan Gunicorn..."
        exec gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - "app:create_app()"

  # ──────────────────────────────────────────
  # Container 3: Nginx (Reverse Proxy)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: prodisync_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - prodisync_net
    depends_on:
      - app

# ──────────────────────────────────────────
# Volumes & Networks
# ──────────────────────────────────────────
volumes:
  db_data:
    driver: local

networks:
  prodisync_net:
    driver: bridge
