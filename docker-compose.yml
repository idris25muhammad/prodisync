services:
  # ──────────────────────────────────────────
  # Container 1: MySQL Database
  # ──────────────────────────────────────────
  prodisyncdb:
    image: mysql:8.0
    container_name: prodisyncdb
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prodisync_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - prodisync_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────
  # Container 2: Flask Application (Gunicorn)
  # ──────────────────────────────────────────
  prodisyncapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: prodisyncapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: prodisyncdb
      DB_PORT: "3306"
    volumes:
      - ./storage:/app/storage
    networks:
      - prodisync_net
    depends_on:
      prodisyncdb:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "==> Menjalankan migrasi database (Flask-Migrate)..."
        flask db upgrade
        echo "==> Seed data pengguna & tahun ajaran..."
        flask seed-db || true
        echo "==> Seed katalog mata kuliah..."
        flask seed-matakuliah || true
        echo "==> Semua selesai. Menjalankan Gunicorn..."
        exec gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - "app:create_app()"

# ──────────────────────────────────────────
# Volumes & Networks
# ──────────────────────────────────────────
volumes:
  prodisync_db_data:
    driver: local

networks:
  prodisync_net:
    driver: bridge
