server {
    listen 80;
    server_name _;  # Ganti dengan domain Anda, misal: prodisync.example.com

    # ── Static files – dilayani langsung oleh Nginx (lebih cepat) ──
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Semua request lain → diteruskan ke Flask/Gunicorn ──
    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;

        # Header wajib untuk proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout untuk proses berat (generate PDF, dsb.)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffer settings
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload limit (sesuaikan untuk arsip dokumen) ──
    client_max_body_size 20M;

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
